name: render shorts

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  workflow_dispatch:          # and a manual "Run workflow" button

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Liberation Sans stands in for Arial on the runner; config.py picks it up.
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Render the queue
        run: cd pipeline && python run_batch.py

      - name: Upload finished shorts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.txt
          retention-days: 90
          if-no-files-found: warn

      # Keep the queue state so a rendered episode is not built twice.
      - name: Commit queue state
        run: |
          git config user.name  "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add scripts/queue scripts/done
          git diff --staged --quiet || git commit -m "chore: mark rendered episodes done"
          git push

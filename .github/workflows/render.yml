name: render shorts

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  push:
    paths:
      - "scripts/queue/**"   # a new script in the queue renders itself
  workflow_dispatch:
    inputs:
      engine:
        description: "Renderer"
        type: choice
        options: [hyperframes, pillow]
        default: hyperframes

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Liberation Sans stands in for Arial in the burned-in captions;
      # config.py picks it up. The HyperFrames composition pulls its own
      # display face from Google Fonts, so it needs nothing installed here.
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation

      - name: Install deps
        run: |
          pip install -r requirements.txt
          npm ci || npm install

      - name: Regenerate background assets
        run: cd pipeline && python export_assets.py

      - name: Render the queue
        run: |
          cd pipeline
          python run_batch.py ${{ (github.event.inputs.engine == 'pillow') && '--pillow' || '' }}

      - name: Upload finished shorts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit queue state
        run: |
          git config user.name  "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add scripts/queue scripts/done
          git diff --staged --quiet || git commit -m "chore: mark rendered episodes done"
          git push

name: render shorts

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  push:
    paths:
      - "scripts/queue/**"   # a new script in the queue renders itself
      - "pipeline/**"        # and a change to the renderer re-proves itself
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      engine:
        description: "Renderer"
        type: choice
        options: [hyperframes, pillow]
        default: hyperframes

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Liberation Sans stands in for Arial in the burned-in captions;
      # config.py picks it up. The HyperFrames composition pulls its own
      # display face from Google Fonts, so it needs nothing installed here.
      # ffmpeg here brings ffprobe, which HyperFrames requires. The pip route
      # (imageio-ffmpeg + static-ffmpeg) is for macOS, where Homebrew has no
      # bottles for this OS version; on a runner the distro package is simpler
      # and does not depend on a binary fetch at render time.
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
          ffprobe -version | head -1

      - name: Install deps
        run: |
          pip install -r requirements.txt
          npm ci || npm install

      - name: Regenerate background assets
        run: cd pipeline && python export_assets.py

      - name: Render the queue
        id: render
        run: |
          mkdir -p ci-logs
          cd pipeline
          set -o pipefail
          python -u run_batch.py ${{ (github.event.inputs.engine == 'pillow') && '--pillow' || '' }} \
            2>&1 | tee ../ci-logs/render.log

      # Workflow logs need admin rights to fetch over the API, so a failure is
      # invisible to anyone without them. Commit the tail of the log instead:
      # the repository is readable, so the error can be diagnosed from outside.
      - name: Publish the failure log
        if: failure()
        run: |
          mkdir -p ci-logs
          { echo "run ${{ github.run_number }} - ${{ github.sha }}"; echo;
            tail -n 120 ci-logs/render.log 2>/dev/null || echo "(no render.log produced)"; 
          } > ci-logs/last-failure.txt
          git config user.name  "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -f ci-logs/last-failure.txt
          git commit -m "ci: record failure log for run ${{ github.run_number }}" || true
          git push || true

      - name: Upload finished shorts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit queue state
        run: |
          git config user.name  "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add scripts/queue scripts/done
          git diff --staged --quiet || git commit -m "chore: mark rendered episodes done"
          git push
